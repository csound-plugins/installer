name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & CLI smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run lint and CLI tests
        run: bash tests/lint.sh

  macos-smoke:
    name: macOS install & render smoke test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Csound and render a .csd
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_ARTIFACT_DIR: ${{ runner.temp }}/csound-render
        run: bash tests/macos_smoke.sh
      - name: Upload rendered output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-render
          path: ${{ runner.temp }}/csound-render
